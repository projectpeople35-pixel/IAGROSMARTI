<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- Tech / Smart sensor ring accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="12 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <!-- Soil base arc -->
  <path d="M 160 380 Q 256 420 352 380 Q 256 360 160 380 Z" fill="#b45309" opacity="0.9"/>
  <path d="M 180 376 Q 256 405 332 376 Q 256 365 180 376 Z" fill="#d97706" opacity="0.6"/>
  <!-- Main stem -->
  <path d="M 256 370 C 256 300, 252 240, 240 180" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round"/>
  <!-- Left Leaf -->
  <path d="M 246 250 C 180 250, 140 190, 170 140 C 220 150, 246 200, 246 250 Z" fill="url(#leaf)"/>
  <!-- Right Leaf -->
  <path d="M 242 210 C 290 170, 350 170, 360 220 C 320 250, 270 240, 242 210 Z" fill="url(#leaf)"/>
  <!-- Sprout Bud / Sensor node -->
  <circle cx="240" cy="180" r="14" fill="#6ee7b7"/>
  <circle cx="240" cy="180" r="6" fill="#ffffff"/>
  <!-- Digital Pulse Dots -->
  <circle cx="340" cy="150" r="8" fill="#34d399"/>
  <circle cx="170" cy="290" r="6" fill="#34d399"/>
  <circle cx="350" cy="290" r="6" fill="#34d399"/>
  <!-- Wi-Fi / Smart wave arc above plant -->
  <path d="M 200 110 Q 240 90 280 110" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>
  <path d="M 215 130 Q 240 115 265 130" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
</svg>
